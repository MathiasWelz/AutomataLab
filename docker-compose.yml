services:
  postgres:
    image: postgres:15-alpine
    container_name: automatalab-db
    environment:
      POSTGRES_USER: automatalab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automatalab_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U automatalab']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: automatalab-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automatalab-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GIN_MODE: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: automatalab
      DB_PASSWORD: password
      DB_NAME: automatalab_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /root/main

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: automatalab-network
